<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #333;
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: calc(100% - 22px);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
    <h2>Keyboard Events</h2>
<p>It Happens when the user pressed an key on the keyboard</p>
<ol>
    <li>keydown</li>
     <li>keyup</li>
     <li>keypress</li>
</ol>
<input id="k" type="text" placeholder="Type something here">
<p id="demo"></p>
</div>
</body>
<script>
    const input = document.getElementById("k");
    input.addEventListener("keydown", function(event) {
        document.getElementById("demo").innerHTML = "Key down: " + event.code;
    });
    input.addEventListener("keyup", function(event) {
        document.getElementById("demo").innerHTML = "Key up: " + event.key;
    });
</script>
</body>
</html>
