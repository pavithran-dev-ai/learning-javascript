<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
        }
        
    </style>
</head>
<body>
    <div class="container">
    <h1>Event Management</h1>
    <p>Event Management is about adding,removing,and controlling the events</p>
    <button id="addEvent">Add Event</button>
    <p id="demo"></p>
    </div>
</body>
<script>
    const button = document.getElementById("addEvent");
    button.addEventListener("click", function() {
        document.getElementById("demo").innerHTML = "Event added!";
    });
</script>
</html>
