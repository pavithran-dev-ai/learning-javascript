<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Length Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wrapper">
        <h2>cm to inches</h2>
        <div id="inputdiv">
        <input type="text" id="cm" placeholder="Enter cm">
        </div>
        <div>
            <button type="submit" onclick="convert()">Convert</button>
        </div>
        <div id="result">

        </div>
    </div>
</body>
<script>
   function convert() {
       let cmvalue = Number(document.getElementById("cm").value);
       let inchval = cmvalue / 2.54;
       let result = document.getElementById("result").innerHTML = inchval;
   }
</script>
</html>
