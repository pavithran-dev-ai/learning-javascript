<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation</title>
</head>
<body>
    <h1>Changing HTML para Content</h1>
    <p id="pa0">old paragraph</p>
    <p>Document.write are used to write the content directly in the html o/p Stream</p>
</body>
<script>
    const element0=document.getElementById("pa0");
    element0.innerHTML = "This is an New Paragraph";
    document.write("Add the Content to HTML o/p Stream");
</script>
</html>
