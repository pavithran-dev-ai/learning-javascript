<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        body{
            margin: auto;
            padding: 0%;
            background-color: rgb(193, 243, 247);
        }
        h1{
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 30vh;
        }
        #wrapper{
            border: solid 2px black;
            padding: 30px;
            border-radius: 10px;
            background-color: rgb(170, 235, 252);
            font-size: large;
        }
        #wrapper:hover::after{
            content: "Hello!";
        }
    </style>
</head>
<body>
    <h1>Digital Clock</h1>
     <div class ="container">
        <div id ="wrapper">
            <span id="hour">00</span>
            <span>:</span>
            <span id="minute">00</span>
            <span>:</span>
            <span id="second">00</span>
            <span id="ampm">AM</span>
        </div>
</body>
<script src="clock.js"></script>
</html>
